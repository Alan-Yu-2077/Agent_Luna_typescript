name: Pages

# Deploys the engineering showcase (showcase/engineering/ — the agent-harness map + component
# decks) to GitHub Pages as the site root. Pure static upload, no build step. Luna TV (the
# earlier showcase/ CRT-channel page) is retired — see the commit that removed it.

on:
  push:
    branches: [main]
    paths:
      - 'showcase/engineering/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/engineering
      - id: deployment
        uses: actions/deploy-pages@v4
